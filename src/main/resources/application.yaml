spring:
  application:
    name: retirement-planner

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/retirement_planner}
    username: ${DB_USERNAME:leedongwon}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET}
  # RTR 도입(D-161/M14) — accessToken은 짧게 끊고 refreshToken 회전으로 세션을 이어간다.
  # 기존 7일 단일발급(D-081)은 폐기, 프론트 lib/api.ts가 401 시 자동 갱신하는 것과 세트.
  access-token-validity-ms: 900000       # 15분
  refresh-token-validity-ms: 1209600000  # 14일

app:
  share-url: https://retirement-planner.vercel.app
  frontend-callback-url: ${FRONTEND_CALLBACK_URL:http://localhost:3000/auth/callback}
  national-pension:
    # 2025.12~2026.11 적용 실제 값(319.3511만원, 국민연금공단) — 기존 319.35는 근사치였음(M14 세법 검증 계기 수정)
    # 매년 갱신되는 값을 하드코딩하는 한계는 여전함 — 자동화는 M15 스코프
    a-value: 319.3511

price-api:
  data-go-kr:
    key: ${DATA_GO_KR_API_KEY}
  finnhub:
    key: ${FINNHUB_API_KEY}
  koreaexim:
    key: ${KOREAEXIM_API_KEY}

opendart:
  api-key: ${OPENDART_API_KEY:}

sms:
  sens:
    enabled: ${SENS_ENABLED:false}
    access-key: ${SENS_ACCESS_KEY:}
    secret-key: ${SENS_SECRET_KEY:}
    service-id: ${SENS_SERVICE_ID:}
    sender-phone: ${SENS_SENDER_PHONE:}

# M14(D-162 후속) — 외부 시세 API가 지속 장애 상태일 때 매 요청마다 타임아웃(2~4초)을
# 다 채우고 나서야 캐시로 폴백하는 걸 막는다. 실패가 쌓이면 회로를 열어 즉시 캐시 폴백으로
# 직행하고, 일정 시간 뒤 반개방 상태에서 소수 요청만 흘려보내 복구를 확인한다.
# PriceService의 기존 캐시/stale-on-error 흡수(D-058)는 그대로 유지 — 서킷브레이커는
# "빠르게 실패"만 담당하고 사용자 응답 형태(Optional.empty vs 캐시값)는 바꾸지 않는다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      domesticStockPrice:
        base-config: default
      foreignStockPrice:
        base-config: default
      cryptoPrice:
        base-config: default